    <!-- Scroll & Lightbox Animation Script -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const observerOptions = {
                root: null,
                rootMargin: '0px',
                threshold: 0.15
            };

            const observer = new IntersectionObserver((entries, observer) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        entry.target.classList.add('is-visible');
                    }
                });
            }, observerOptions);

            // 雿輻 MutationObserver ???????.fade-up ??嚗???Web Components嚗?            const observeFadeUps = () => {
                document.querySelectorAll('.fade-up:not([data-observed])')
                    .forEach(el => {
                        el.dataset.observed = '1';
                        observer.observe(el);
                    });
            };
            observeFadeUps();
            new MutationObserver(observeFadeUps).observe(document.body, { childList: true, subtree: true });

            // Back to Top Button Visibility
            const backToTopBtn = document.getElementById('backToTopBtn');

            // Hero Parallax Effect
            const heroSection = document.getElementById('hero-section');
            const heroContent = heroSection ? heroSection.querySelector('.w-full.relative.z-10') : null;

            window.addEventListener('scroll', () => {
                const scrolled = window.scrollY;

                // Hero Parallax logic
                if (heroSection && scrolled < window.innerHeight) {
                    if (heroContent) {
                        heroContent.style.transform = `translateY(${scrolled * 0.3}px)`;
                        heroContent.style.opacity = 1 - (scrolled / (window.innerHeight * 0.8));
                    }
                }

                // Back to Top Button Visibility
                if (backToTopBtn) {
                    if (scrolled > window.innerHeight * 0.5) {
                        backToTopBtn.classList.remove('opacity-0', 'translate-y-4', 'pointer-events-none');
                        backToTopBtn.classList.add('opacity-[0.30]', 'hover:opacity-60', 'pointer-events-auto');
                    } else {
                        backToTopBtn.classList.add('opacity-0', 'translate-y-4', 'pointer-events-none');
                        backToTopBtn.classList.remove('opacity-[0.30]', 'hover:opacity-60', 'pointer-events-auto');
                    }
                }
            });

            // Lightbox Logic
            const lightboxOverlay = document.getElementById('lightbox-overlay');
            const lightboxContainer = document.getElementById('lightbox-container');
            const lightboxClose = document.getElementById('close-lightbox');
            const lightboxIframe = document.getElementById('lightbox-iframe');
            const body = document.body;

            let isChildLightboxOpen = false;
            let closeTimeout = null;

            window.addEventListener('message', (e) => {
                if (e.data.type === 'Showcase:OpenLightbox') {
                    isChildLightboxOpen = true;
                    if (lightboxClose) lightboxClose.classList.add('opacity-0', 'pointer-events-none');
                } else if (e.data.type === 'Showcase:CloseLightbox') {
                    isChildLightboxOpen = false;
                    if (lightboxClose) lightboxClose.classList.remove('opacity-0', 'pointer-events-none');
                } else if (e.data.type === 'Showcase:CloseParentLightbox') {
                    closeLightbox();
                }
            });

            const openLightbox = (url) => {
                if (closeTimeout) {
                    clearTimeout(closeTimeout);
                    closeTimeout = null;
                }
                lightboxIframe.src = url;
                body.classList.add('lightbox-open');
                lightboxOverlay.style.pointerEvents = 'auto';
            };

            const closeLightbox = () => {
                // 憒?摮??Ｙ?蝞梢??葉嚗???摰??? postMessage 閫貊 child ??Esc ????亥矽?剁?
                if (isChildLightboxOpen) {
                    try {
                        const frameWin = lightboxIframe.contentWindow;
                        if (frameWin && frameWin.closeImageLightbox) {
                            frameWin.closeImageLightbox();
                            return;
                        }
                    } catch (e) {
                        // 頝函雯???嗆?嚗???虜?質撌梯???Esc ????
                        // 雿?舫??撅?Overlay嚗??甇斗??芯?霈撅日???                        return;
                    }
                }

                body.classList.remove('lightbox-open');
                lightboxOverlay.style.pointerEvents = 'none';

                // 皜?? timeout ?踹???閫貊
                if (closeTimeout) clearTimeout(closeTimeout);

                // Wait for animation to finish before clearing src to prevent flicker
                closeTimeout = setTimeout(() => {
                    lightboxIframe.src = '';
                    isChildLightboxOpen = false;
                    if (lightboxClose) lightboxClose.classList.remove('opacity-0', 'pointer-events-none');
                    closeTimeout = null;
                }, 600);
            };


            // 鈭辣憪晷嚗??????? .lightbox-trigger
            document.addEventListener('click', (e) => {
                const trigger = e.target.closest('.lightbox-trigger');
                if (!trigger) return;
                e.preventDefault();
                e.stopPropagation();
                const url = trigger.getAttribute('href');
                openLightbox(url);
            });

            lightboxClose.addEventListener('click', closeLightbox);
            lightboxOverlay.addEventListener('click', closeLightbox);

            // 3D Tilt Effect for Bio Card
            const bioCard = document.querySelector('.tilt-card');
            if (bioCard) {
                const isMobile = window.innerWidth < 768;
                if (!isMobile) {
                    bioCard.addEventListener('mousemove', (e) => {
                        const rect = bioCard.getBoundingClientRect();
                        const x = e.clientX - rect.left;
                        const y = e.clientY - rect.top;

                        const centerX = rect.width / 2;
                        const centerY = rect.height / 2;

                        const rotateX = ((y - centerY) / centerY) * -8; // ?暹?閫漲
                        const rotateY = ((x - centerX) / centerX) * 8;

                        bioCard.style.transform = `perspective(1000px) rotateX(${rotateX}deg) rotateY(${rotateY}deg) scale3d(1.02, 1.02, 1.02)`;
                    });

                    bioCard.addEventListener('mouseleave', () => {
                        bioCard.style.transform = `perspective(1000px) rotateX(0deg) rotateY(0deg) scale3d(1, 1, 1)`;
                    });
                }
            }

            // Close on ESC
            window.addEventListener('keydown', (e) => {
                if (e.key === 'Escape' && body.classList.contains('lightbox-open')) {
                    if (isChildLightboxOpen) return; // 霈?iframe ?折??Esc ?摩?芸??瑁?
                    closeLightbox();
                }
            });
        });

    </script>
